<!doctype html>
<html lang="id" data-theme="langit">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sesi Latihan</title>
  <link rel="icon" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/interview.css">
</head>
<body data-root="../">
  <div id="content" class="session">
    <section class="left">
      <div class="card video">
        <video id="cam" autoplay muted playsinline></video>
        <div class="ph" id="ph">
          <p id="phText">Kamera belum aktif</p>
          <button class="btn" id="previewBtn">Aktifkan kamera</button>
        </div>
        <div class="guide" id="guide" hidden></div>
        <div class="vtag" id="vtag" hidden><i></i><span id="timer">00:00 / 02:00</span></div>
        <div class="proc" id="proc" hidden>
          <div class="proc-box">
            <h3>Memproses sesi</h3>
            <p class="muted" id="procMsg">Mengirim rekaman…</p>
            <div class="bar"><i id="procBar" style="width:0;background:var(--accent)"></i></div>
            <button class="btn" id="retryBtn" hidden onclick="location.reload()">Muat ulang</button>
          </div>
        </div>
      </div>
      <div class="card tipbar">
        <span class="tipt">Tips</span>
        <span>Wajah di tengah bingkai</span>
        <span>Cahaya dari depan</span>
        <span>Kamera sejajar mata</span>
        <span>Tatap kamera seolah itu pewawancara</span>
      </div>
    </section>

    <aside class="card qside">
      <div class="qs-head"><h2>Daftar pertanyaan</h2><span class="chip" id="qCount"></span></div>
      <div class="progress"><i id="prog"></i></div>
      <div class="qs-body" id="qBody"></div>
      <div class="qs-foot">
        <label class="check" id="consentRow">
          <input type="checkbox" id="consent">
          <span>Saya setuju rekaman dikirim ke server untuk dianalisis dan dihapus setelah selesai.</span>
        </label>
        <button class="btn primary block" id="startBtn">Mulai sesi</button>
        <button class="btn primary block" id="nextBtn" hidden>Pertanyaan berikutnya</button>
      </div>
    </aside>
  </div>
  <script type="module" src="../assets/js/pages/interview.js"></script>
</body>
</html>
